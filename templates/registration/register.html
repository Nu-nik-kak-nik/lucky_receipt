{% extends "base.html" %}
{% block title %}Регистрация — Чек на удачу{% endblock %}
{% block content %}
<div class="auth-card">
    <h1 class="auth-card__title">Регистрация</h1>
    <form method="post" class="auth-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn--primary">Зарегистрироваться</button>
    </form>
    <p class="auth-card__hint">
        Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a>
    </p>
</div>
{% endblock %}
